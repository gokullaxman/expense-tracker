<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #fff;
      overflow: hidden;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      background: linear-gradient(to right, rgba(255,255,255,0.08), rgba(18,18,18,0.9));
      backdrop-filter: blur(8px);
      padding: 32px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
      position: relative;
      z-index: 2;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    h1 { text-align: center; margin-bottom: 20px; font-size: 28px; font-weight: 700; }
    .group { display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 12px 14px;
      outline: none;
    }
    input::placeholder { color: #cbd5e1; }
    .error { color: #f87171; font-size: 13px; min-height: 16px; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 12px;
      color: #fff;
      background: rgba(255,255,255,0.14);
      cursor: pointer;
      margin-top: 8px;
      font-weight: 600;
    }
    .btn:hover { background: rgba(255,255,255,0.24); }
    .meta {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
    }
    .meta a { color: rgba(255,255,255,0.9); }
    .back {
      position: fixed;
      top: 14px;
      left: 14px;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 10px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Back to PricePulse</a>
  <div class="card">
    <div class="logo"><img src="http://hextaui.com/logo.svg" alt="logo" width="24" height="24" /></div>
    <h1>Create Account</h1>
    <div class="group">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password (min 6 chars)" />
      <div id="error" class="error"></div>
    </div>
    <button id="signup" class="btn">Sign up</button>
    <div class="meta">Already have an account? <a href="/signin.html">Sign in</a></div>
  </div>

  <script>
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const error = document.getElementById("error");
    const btn = document.getElementById("signup");
    const validateEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

    const runSignUp = async () => {
      if (!email.value || !password.value) {
        error.textContent = "Please enter both email and password.";
        return;
      }
      if (!validateEmail(email.value)) {
        error.textContent = "Please enter a valid email address.";
        return;
      }
      if (password.value.length < 6) {
        error.textContent = "Password must be at least 6 characters.";
        return;
      }
      error.textContent = "";
      btn.disabled = true;
      btn.textContent = "Creating account...";
      try {
        const res = await fetch("/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email.value.trim(),
            password: password.value,
          }),
        });
        const data = await res.json();
        if (!data.success) {
          error.textContent = data.error || "Sign up failed.";
          return;
        }
        window.location.href = "/signin.html";
      } catch (e) {
        error.textContent = "Unable to sign up. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign up";
      }
    };

    btn.addEventListener("click", runSignUp);
    password.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSignUp();
    });
  </script>
</body>
</html>
